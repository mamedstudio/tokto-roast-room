<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roast Room — Tokto & CupomClic</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #060b13; color: #f1f5f9; overflow-x: hidden; }
    
    /* Brilho e destaque idênticos ao vídeo */
    .glow-active {
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.55), 0 0 10px rgba(56, 189, 248, 0.3) !important;
      border-color: #38bdf8 !important;
      transform: translateY(-8px) scale(1.08) !important;
      z-index: 30 !important;
    }

    /* Arco do conselho: curva matemática de altura */
    .seat-0 { transform: translateY(32px); }
    .seat-1 { transform: translateY(14px); }
    .seat-2 { transform: translateY(2px); }
    .seat-3 { transform: translateY(0px); }
    .seat-4 { transform: translateY(2px); }
    .seat-5 { transform: translateY(14px); }
    .seat-6 { transform: translateY(32px); }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans select-none">

  <!-- Barra Superior -->
  <header class="border-b border-slate-800/80 px-6 py-3 flex items-center justify-between bg-slate-950/40 backdrop-blur">
    <div class="flex items-center space-x-3">
      <div class="bg-cyan-600 text-white font-black px-2.5 py-1 rounded text-xs tracking-wider shadow">CMS</div>
      <h1 class="text-sm font-bold text-white tracking-wide">Roast Room <span class="text-xs text-slate-400 font-normal ml-2">Tokto & CupomClic</span></h1>
    </div>
    <div class="flex items-center space-x-4 text-xs">
      <button onclick="reiniciarDebate()" class="text-slate-400 hover:text-white transition">Reiniciar</button>
      <span class="bg-slate-900 px-2.5 py-1 rounded border border-slate-800 text-cyan-400 font-mono" id="round-indicator">Rodada 1 de 6</span>
    </div>
  </header>

  <!-- Área Principal -->
  <main class="flex-1 flex flex-col lg:flex-row">
    
    <!-- Palco do Debate (Centro) -->
    <section class="flex-1 flex flex-col p-6 justify-between border-b lg:border-b-0 lg:border-r border-slate-800/80 relative">
      
      <!-- Linha Superior de Contexto -->
      <div class="bg-slate-900/50 border border-slate-800 rounded-lg px-4 py-2.5 flex items-center justify-between text-xs text-slate-300">
        <div>
          Foco: <strong class="text-white">200 lojistas</strong> | Modelo: <strong class="text-white">15% embutidos</strong> | Influenciador: <strong class="text-white">1% rev-share</strong>
        </div>
        <span class="text-emerald-400 font-semibold bg-emerald-950/40 border border-emerald-800/60 px-2 py-0.5 rounded">Consenso: 6/7 Aprovam</span>
      </div>

      <!-- Semicírculo com Linhas de Conexão -->
      <div class="relative py-14 flex items-center justify-center min-h-[300px]">
        
        <!-- Curvas SVG de conexão entre as cabeças -->
        <svg class="absolute inset-0 w-full h-full pointer-events-none stroke-slate-800" fill="none" stroke-width="1.5" stroke-dasharray="4 4">
          <path d="M 120 180 Q 500 40 880 180" class="stroke-cyan-900/30" />
        </svg>

        <!-- Grid dos 7 Conselheiros em Arco -->
        <div class="grid grid-cols-7 gap-2 md:gap-3 w-full max-w-5xl relative z-10" id="advisors-grid">
          <!-- Gerado via JS -->
        </div>
      </div>

      <!-- Balão de Fala do Conselheiro Ativo -->
      <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-5 relative shadow-2xl min-h-[150px] flex flex-col justify-between backdrop-blur">
        <div>
          <div class="flex items-center justify-between mb-2">
            <span class="text-cyan-400 font-bold text-sm" id="active-advisor-name">Alex Hormozi</span>
            <span class="text-xs bg-slate-800 text-slate-300 px-2.5 py-0.5 rounded border border-slate-700/60 font-mono" id="active-target">Pushes back on: Paul Graham</span>
          </div>
          <p class="text-sm md:text-base text-slate-200 leading-relaxed italic" id="active-speech">
            "Carregando fala..."
          </p>
        </div>

        <!-- Rodapé do Balão -->
        <div class="flex items-center justify-between pt-4 mt-3 border-t border-slate-800/80 text-xs">
          <span class="text-slate-400 font-mono" id="turn-counter">Fala 1 de 6</span>
          <button onclick="proximaFala()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-semibold px-4 py-2 rounded-lg transition shadow-lg shadow-cyan-950">
            Avançar Fala →
          </button>
        </div>
      </div>
    </section>

    <!-- Barra Lateral: Key Points -->
    <aside class="w-full lg:w-80 bg-slate-950/60 p-4 overflow-y-auto border-t lg:border-t-0 border-slate-800/80 text-xs">
      <h2 class="font-bold uppercase tracking-wider text-slate-400 mb-3 text-[11px]">Pontos-Chave (Key Points)</h2>
      <div class="space-y-2.5" id="key-points-list"></div>
    </aside>

  </main>

  <script>
    // Avatares com fallback estável via Unavatar (sem bloqueio de CORS)
    const conselheiros = [
      { id: "bezos", nome: "Jeff Bezos", foto: "https://unavatar.io/twitter/JeffBezos?fallback=https://api.dicebear.com/7.x/bottts/svg?seed=Bezos", voto: "Sim" },
      { id: "graham", nome: "Paul Graham", foto: "https://unavatar.io/twitter/paulg?fallback=https://api.dicebear.com/7.x/bottts/svg?seed=Paul", voto: "Sim" },
      { id: "hormozi", nome: "Alex Hormozi", foto: "https://unavatar.io/twitter/AlexHormozi?fallback=https://api.dicebear.com/7.x/bottts/svg?seed=Hormozi", voto: "Sim" },
      { id: "gary", nome: "Gary Vee", foto: "https://unavatar.io/twitter/garyvee?fallback=https://api.dicebear.com/7.x/bottts/svg?seed=Gary", voto: "Sim" },
      { id: "dan", nome: "Dan Martell", foto: "https://unavatar.io/twitter/danmartell?fallback=https://api.dicebear.com/7.x/bottts/svg?seed=Dan", voto: "Alerta" },
      { id: "gino", nome: "Gino Wickman", foto: "https://unavatar.io/twitter/GinoWickman?fallback=https://api.dicebear.com/7.x/bottts/svg?seed=Gino", voto: "Sim" },
      { id: "buffett", nome: "Warren Buffett", foto: "https://api.dicebear.com/7.x/micah/svg?seed=Buffett", voto: "Sim" }
    ];

    const debate = [
      {
        orador: "hormozi",
        alvo: "Modelo Geral",
        texto: "Embutir 15% no desconto agressivo e tirar o trabalho do lojista (ele só manda foto e preço) é genial. Mas 200 lojistas manuais exigem volume. Cuidado para não virarem uma agência de bairro!",
        resumo: "Hormozi aprova 15% embutidos, mas alerta para o custo operacional de gerir 200 lojas à mão."
      },
      {
        orador: "buffett",
        alvo: "Alex Hormozi",
        texto: "A margem de 14% líquida (15% menos 1% do influenciador) protege o capital se a calculadora de tráfego for calibrada. Operação financiada pelo próprio cliente, sem queima de caixa.",
        resumo: "Buffett calcula 14% de margem líquida e aprova a ausência de adiantamento de capital."
      },
      {
        orador: "graham",
        alvo: "Warren Buffett",
        texto: "Manter automação em stand-by e fazer manual para 200 lojistas é o manual clássico de startup: façam coisas que não escalam antes de automatizar o processo errado.",
        resumo: "Graham elogia a fase manual nos 200 lojistas pioneiros para refinar a oferta."
      },
      {
        orador: "gary",
        alvo: "Dan Martell",
        texto: "Influenciador a 1% só funciona se o cheque do primeiro mês for relevante. Se o criador receber 90 reais no mês, vai embora. Garantam alto volume inicial de vendas no balcão!",
        resumo: "Gary Vee exige volume imediato para não desmotivar o criador de 10k."
      },
      {
        orador: "dan",
        alvo: "Paul Graham",
        texto: "Fazer na mão é bom, mas tem prazo de validade: 60 dias. Se passarem disso, os fundadores viram escravos de cortar fotos e colar textos no WhatsApp. Liguem a automação assim que estabilizar.",
        resumo: "Dan Martell estipula teto de 60 dias manuais antes de ativar as automações."
      },
      {
        orador: "gino",
        alvo: "Todos",
        texto: "A meta única da semana: quantos QR Codes foram bipados no balcão? Esqueçam curtidas e cliques. O scorecard manda. Modelo aprovado para execução imediata!",
        resumo: "Gino Wickman define a métrica-rei: total de QR Codes convertidos em caixa."
      }
    ];

    let indiceAtual = 0;

    function renderizarConselho() {
      const grid = document.getElementById("advisors-grid");
      grid.innerHTML = conselheiros.map((c, i) => `
        <div id="card-${c.id}" class="seat-${i} flex flex-col items-center p-2 rounded-xl border border-slate-800 bg-slate-900/40 transition-all duration-300">
          <img src="${c.foto}" alt="${c.nome}" class="w-12 h-12 md:w-16 md:h-16 rounded-full object-cover border-2 border-slate-700 mb-2 bg-slate-800">
          <span class="text-[11px] font-bold text-slate-200 truncate w-full text-center">${c.nome}</span>
          <span class="text-[9px] ${c.voto === 'Sim' ? 'text-emerald-400' : 'text-amber-400'} font-semibold mt-0.5">${c.voto}</span>
        </div>
      `).join("");
    }

    function atualizarFala() {
      const fala = debate[indiceAtual];
      const orador = conselheiros.find(c => c.id === fala.orador);

      conselheiros.forEach(c => {
        const el = document.getElementById(`card-${c.id}`);
        if (el) el.classList.remove("glow-active", "bg-slate-800");
      });
      const elAtivo = document.getElementById(`card-${orador.id}`);
      if (elAtivo) elAtivo.classList.add("glow-active", "bg-slate-800");

      document.getElementById("active-advisor-name").innerText = orador.nome;
      document.getElementById("active-target").innerText = `Pushes back on: ${fala.alvo}`;
      document.getElementById("active-speech").innerText = `"${fala.texto}"`;
      document.getElementById("turn-counter").innerText = `Fala ${indiceAtual + 1} de ${debate.length}`;
      document.getElementById("round-indicator").innerText = `Rodada ${indiceAtual + 1} de ${debate.length}`;

      const lista = document.getElementById("key-points-list");
      lista.innerHTML = debate.slice(0, indiceAtual + 1).map(d => {
        const adv = conselheiros.find(c => c.id === d.orador);
        return `
          <div class="p-2.5 rounded bg-slate-900/90 border border-slate-800">
            <span class="font-bold text-cyan-400 block mb-0.5">${adv.nome}</span>
            <span class="text-slate-300">${d.resumo}</span>
          </div>
        `;
      }).reverse().join("");
    }

    function proximaFala() {
      indiceAtual = (indiceAtual + 1) % debate.length;
      atualizarFala();
    }

    function reiniciarDebate() {
      indiceAtual = 0;
      atualizarFala();
    }

    renderizarConselho();
    atualizarFala();
  </script>
</body>
</html>
